name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_PROCESSOR_COUNT: '2'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  validate:
    name: Fast validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GMA_CI_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.403

      - name: Check GMA submodule dev heads
        shell: pwsh
        run: ./eng/check-submodule-dev-heads.ps1

      - name: Bootstrap source roots
        shell: pwsh
        run: ./eng/gma-bootstrap.ps1 -Force

      - name: Check isolated timing report acceptance
        run: python3 eng/check-worker-timing-results.tests.py

      - name: Verify
        shell: pwsh
        run: ./eng/verify.ps1

      - name: Retain isolated worker timing results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: worker-timing-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/test-results/worker-timing
          if-no-files-found: ignore
          retention-days: 7
