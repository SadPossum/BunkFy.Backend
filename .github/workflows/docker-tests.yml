name: Docker Tests

on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_PROCESSOR_COUNT: '2'
  GMA_REQUIRE_DOCKER_TESTS: 'true'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
      control-sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.GMA_CI_TOKEN || github.token }}
          persist-credentials: false
      - shell: pwsh
        run: |
          ./eng/gma-bootstrap.ps1 -Force
          ./eng/check-repository-security.ps1
          ./eng/check-submodule-dev-heads.ps1
          ./eng/update-solutions.ps1 -Check
      - id: groups
        shell: bash
        run: |
          python3 eng/test-docker-groups.tests.py
          python3 eng/compare-ordinary-behavior.tests.py
          echo "matrix=$(python3 eng/test-docker-groups.py --matrix)" >> "$GITHUB_OUTPUT"
      - id: baseline
        name: Resolve the live target branch for the control
        shell: pwsh
        env:
          CONTROL_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $controlRef = "refs/heads/$env:CONTROL_REF"
          & git check-ref-format $controlRef
          if ($LASTEXITCODE -ne 0) { throw 'Invalid control branch.' }
          $branch = [Uri]::EscapeDataString($env:CONTROL_REF)
          $controlMatches = @(& gh api "repos/$env:GH_REPO/git/ref/heads/$branch" --jq '.object.sha')
          if ($LASTEXITCODE -ne 0 -or $controlMatches.Count -ne 1) { throw 'Cannot resolve the live control branch.' }
          $controlSha = $controlMatches[0]
          if ($controlSha -notmatch '^[a-f0-9]{40}$') { throw 'Invalid control source identity.' }
          "sha=$controlSha" >> $env:GITHUB_OUTPUT

  storage-fixture:
    name: Qualify the bounded storage fixture before provider suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image-id: ${{ steps.archive.outputs.image-id }}
      evidence-artifact-id: ${{ steps.evidence.outputs.artifact-id }}
      image-artifact-id: ${{ steps.image.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Check authentic security boundaries without containers
        run: python3 eng/operations/check-preview-storage-security.tests.py
      - name: Check image configuration identity across Docker stores
        run: python3 eng/operations/image-config-digest.tests.py
      - name: Prepare the pinned non-root fixture
        shell: pwsh
        run: ./eng/build-provider-images.ps1
      - name: Install the checksum-verified scanner
        run: python3 eng/operations/install-probe-trivy.py
      - name: Record raw fixture findings and inventory
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          cp artifacts/tool-identity.json artifacts/provider-images/tool-identity.json
          set +e
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output artifacts/provider-images/silo-security.json bunkfy-provider-silo:c3ad836aed0d-nonroot-v1
          scan_status=$?
          echo "exit_code=$scan_status" >> "$GITHUB_OUTPUT"
          trivy image --format cyclonedx --output artifacts/provider-images/silo-sbom.cdx.json bunkfy-provider-silo:c3ad836aed0d-nonroot-v1
          inventory_status=$?
          test "$inventory_status" -eq 0 || exit "$inventory_status"
          exit "$scan_status"
      - name: Prove non-root S3, bounded Select, durable restart and cleanup
        run: python3 eng/operations/probe-preview-storage.py --directory artifacts/provider-images --derived-identity artifacts/provider-images/minio.json
      - name: Require exact reviewed provenance and zero unresolved findings
        if: always()
        env:
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: python3 eng/operations/check-preview-storage-security.py --directory artifacts/provider-images --derived-identity artifacts/provider-images/minio.json --scanner-exit-code "$SCAN_EXIT_CODE"
      - name: Preserve the exact qualified image for the native suite
        id: archive
        run: |
          fixture_id=$(python3 eng/operations/image-config-digest.py bunkfy-provider-silo:c3ad836aed0d-nonroot-v1)
          [[ "$fixture_id" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "image-id=$fixture_id" >> "$GITHUB_OUTPUT"
          docker image save --output artifacts/provider-images/storage-fixture.tar bunkfy-provider-silo:c3ad836aed0d-nonroot-v1
          cd artifacts/provider-images
          sha256sum storage-fixture.tar > storage-fixture.tar.sha256
      - name: Retain raw and minimized fixture evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-storage-fixture-${{ github.run_attempt }}
          path: artifacts/provider-images/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Share the exact fixture image for this qualification
        id: image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-storage-fixture-image-${{ github.run_attempt }}
          path: |
            artifacts/provider-images/storage-fixture.tar
            artifacts/provider-images/storage-fixture.tar.sha256
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  provider-tests:
    needs: [plan, storage-fixture]
    outputs:
      candidate-artifact-id: ${{ steps.candidate-evidence.outputs.artifact-id }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.GMA_CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.403
      - shell: pwsh
        run: ./eng/gma-bootstrap.ps1 -Force
      - name: Validate the successful storage producer's artifact identities
        if: matrix.group == 'product-integration'
        env:
          EVIDENCE_ID: ${{ needs.storage-fixture.outputs.evidence-artifact-id }}
          IMAGE_ID: ${{ needs.storage-fixture.outputs.image-artifact-id }}
        run: |
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          [[ "$IMAGE_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
      - name: Download the qualified S3 evidence for product integration
        if: matrix.group == 'product-integration'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.storage-fixture.outputs.evidence-artifact-id }}
          path: artifacts/provider-images
          merge-multiple: true
          digest-mismatch: error
      - name: Download the exact qualified S3 image for product integration
        if: matrix.group == 'product-integration'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.storage-fixture.outputs.image-artifact-id }}
          path: artifacts/provider-images
          merge-multiple: true
          digest-mismatch: error
      - name: Load and verify the image qualified before the provider matrix
        if: matrix.group == 'product-integration'
        env:
          EXPECTED_FIXTURE_ID: ${{ needs.storage-fixture.outputs.image-id }}
        run: |
          [[ "$EXPECTED_FIXTURE_ID" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          (cd artifacts/provider-images && sha256sum --check storage-fixture.tar.sha256)
          docker image load --input artifacts/provider-images/storage-fixture.tar
          actual_id=$(python3 eng/operations/image-config-digest.py bunkfy-provider-silo:c3ad836aed0d-nonroot-v1)
          test "$actual_id" = "$EXPECTED_FIXTURE_ID"
          rm artifacts/provider-images/storage-fixture.tar artifacts/provider-images/storage-fixture.tar.sha256
      - name: Record runner resource baseline
        run: |
          df -h . /var/lib/docker
          free -m
      - name: Run bounded provider group
        run: python3 eng/test-docker-groups.py --group "${{ matrix.group }}"
        env:
          GMA_REQUIRE_DOCKER_TESTS: "true"
      - name: Retain provider test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-provider-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            artifacts/test-results/docker
            artifacts/provider-images
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain candidate ordinary behavior evidence
        id: candidate-evidence
        if: always() && matrix.group == 'product-integration'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-ordinary-candidate-${{ github.run_attempt }}
          path: artifacts/test-results/docker/product-integration/ordinary
          if-no-files-found: error
          retention-days: 30

  ordinary-control:
    needs: [plan, provider-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      control-artifact-id: ${{ steps.control-evidence.outputs.artifact-id }}
    steps:
      - name: Checkout the exact control source and its committed dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.control-sha }}
          path: control
          submodules: recursive
          token: ${{ secrets.GMA_CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.403
      - shell: pwsh
        working-directory: control
        run: ./eng/gma-bootstrap.ps1 -Force
      - name: Exercise the same ordinary contract on the actual control
        working-directory: control
        env:
          BFX_CMP_VARIANT: control
          BFX_CMP_BUILD_FINGERPRINT: ${{ needs.plan.outputs.control-sha }}
          BFX_CMP_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/ordinary/control
        run: >-
          dotnet test tests/Integration.Tests/Integration.Tests.csproj -c Release
          --filter 'Category=Docker&FullyQualifiedName~OrdinaryBehaviorComparisonIntegrationTests'
          --logger 'trx;LogFileName=ordinary-control.trx'
          --results-directory artifacts/test-results/ordinary-control -m:1 -nr:false
      - name: Retain control evidence and test results
        id: control-evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-ordinary-control-${{ github.run_attempt }}
          path: |
            artifacts/ordinary/control
            control/artifacts/test-results/ordinary-control
          if-no-files-found: error
          retention-days: 30

  ordinary-compare:
    needs: [plan, provider-tests, ordinary-control]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require artifacts from the actual successful producer jobs
        env:
          CANDIDATE_ARTIFACT_ID: ${{ needs.provider-tests.outputs.candidate-artifact-id }}
          CONTROL_ARTIFACT_ID: ${{ needs.ordinary-control.outputs.control-artifact-id }}
        run: |
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          [[ "$CONTROL_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.provider-tests.outputs.candidate-artifact-id }}
          path: artifacts/comparison/candidate
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ordinary-control.outputs.control-artifact-id }}
          path: artifacts/comparison/control
          merge-multiple: true
          digest-mismatch: error
      - name: Require exact canonical parity across all 26 operations
        env:
          CONTROL_FINGERPRINT: ${{ needs.plan.outputs.control-sha }}
          CANDIDATE_FINGERPRINT: ${{ github.sha }}
        run: >-
          python3 eng/compare-ordinary-behavior.py
          --control-directory artifacts/comparison/control
          --candidate-directory artifacts/comparison/candidate
          --control-fingerprint "$CONTROL_FINGERPRINT"
          --candidate-fingerprint "$CANDIDATE_FINGERPRINT"
          --output artifacts/comparison/report.json
      - name: Retain the comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunkfy-ordinary-comparison-${{ github.run_attempt }}
          path: artifacts/comparison/report.json
          if-no-files-found: ignore
          retention-days: 30

  docker:
    name: Docker integration tests
    if: always()
    needs: [plan, storage-fixture, provider-tests, ordinary-control, ordinary-compare]
    runs-on: ubuntu-latest
    steps:
      - name: Require every provider group
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          STORAGE_RESULT: ${{ needs.storage-fixture.result }}
          PROVIDER_RESULT: ${{ needs.provider-tests.result }}
          CONTROL_RESULT: ${{ needs.ordinary-control.result }}
          COMPARISON_RESULT: ${{ needs.ordinary-compare.result }}
        run: >-
          test "$PLAN_RESULT" = success && test "$STORAGE_RESULT" = success && test "$PROVIDER_RESULT" = success &&
          test "$CONTROL_RESULT" = success && test "$COMPARISON_RESULT" = success
