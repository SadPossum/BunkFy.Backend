version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Action pins, approval manifests and policy checks are updated together.
    ignore:
      - dependency-name: "SadPossum/GMA-Skeleton/.github/actions/security-baseline"
      - dependency-name: "SadPossum/GMA-Skeleton/.github/actions/source-release-evidence"
    groups:
      compatible-actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet-runtime:
        patterns:
          - 'Microsoft.*'
          - 'Aspire.*'
      test-tooling:
        dependency-type: development
        patterns:
          - 'Microsoft.NET.Test.Sdk'
          - 'xunit*'
          - 'coverlet.*'
